name: Release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.10)"
        required: true
        default: "v1.0.10"
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Cache Robolectric android-all artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing GitHub secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          ls -l "${{ github.workspace }}/my-upload-key.jks"
      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            set +e
            gradle assembleRelease --stacktrace 2>&1 | tee "build-$attempt.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if grep -q "Failed to fetch maven artifact" "build-$attempt.log"; then
              echo "Maven fetch failure detected, retrying..."
              sleep 10
              continue
            fi
            echo "Build failed for a non-Maven reason; see the log above."
            exit "$status"
          done
          echo "Build failed after 3 attempts."
          exit 1
      - name: Show APK and print signing certificate fingerprints
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Create GitHub Release with the signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk --clobber
            gh release edit "$TAG" --title "وكيل الهاتف $TAG" --notes "## وكيل الهاتف v1.0.10

            - إصلاح بطء التنقل في التطبيق: قصر التقاط إمكانية الوصول على حدث تغيير النافذة (بحد أقصى كل ثانيتين أثناء المهام فقط)، تخزين أيقونات التطبيقات وقائمة الحزم مؤقتاً في الخلفية دون إعادة فك التشفير، وإزالة تمويه الخلفية المكلف من النافذة العائمة.
            - إبقاء شريط الدردشة المصغّر (Mini Chat Bar) مفتوحاً بعد ردود الوكيل مع زر إغلاق X صريح، بحيث لا يُغلق تلقائياً إلا عند إغلاقه من المستخدم.
            - تنفيذ الوكيل للضغط الفعلي بدلاً من إرشاد المستخدم للضغط بنفسه: إلزام النموذج بإرجاع أمر تنفيذ أو رفض صريح، إعادة المحاولة بصيغة JSON فقط عند الرد النصي، قصر النقر على العناصر المرصودة دون تخمين إحداثيات، والإفصاح بوضوح عند تعذّر الضغط أو عند قراءة شاشة لعبة شبه فارغة.

            للتثبيت: حمل app-release.apk وثبته على الهاتف.
            يفضل إزالة النسخة السابقة أولا ثم تثبيت هذه النسخة.

            البصمة:
            - SHA-1: سيطبعها سجل البناء (apksigner)
            - SHA-256: سيطبعها سجل البناء (apksigner)"
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --title "وكيل الهاتف $TAG" --notes "## وكيل الهاتف v1.0.10

            - إصلاح بطء التنقل في التطبيق: قصر التقاط إمكانية الوصول على حدث تغيير النافذة (بحد أقصى كل ثانيتين أثناء المهام فقط)، تخزين أيقونات التطبيقات وقائمة الحزم مؤقتاً في الخلفية دون إعادة فك التشفير، وإزالة تمويه الخلفية المكلف من النافذة العائمة.
            - إبقاء شريط الدردشة المصغّر (Mini Chat Bar) مفتوحاً بعد ردود الوكيل مع زر إغلاق X صريح، بحيث لا يُغلق تلقائياً إلا عند إغلاقه من المستخدم.
            - تنفيذ الوكيل للضغط الفعلي بدلاً من إرشاد المستخدم للضغط بنفسه: إلزام النموذج بإرجاع أمر تنفيذ أو رفض صريح، إعادة المحاولة بصيغة JSON فقط عند الرد النصي، قصر النقر على العناصر المرصودة دون تخمين إحداثيات، والإفصاح بوضوح عند تعذّر الضغط أو عند قراءة شاشة لعبة شبه فارغة.

            للتثبيت: حمل app-release.apk وثبته على الهاتف.
            يفضل إزالة النسخة السابقة أولا ثم تثبيت هذه النسخة.

            البصمة:
            - SHA-1: سيطبعها سجل البناء (apksigner)
            - SHA-256: سيطبعها سجل البناء (apksigner)"
          fi
